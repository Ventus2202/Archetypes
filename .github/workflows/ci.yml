name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Keep in sync with README (Flutter 3.41.9 / Dart 3.11.5) and the
          # pubspec SDK constraint (^3.11.5).
          flutter-version: '3.41.9'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Drift DB code + Riverpod generated code. Mandatory: the project does not
      # compile without app_database.g.dart.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # AppLocalizations from the .arb files (also mandatory for compilation).
      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
